<!DOCTYPE html>
<title>Redirect - Traveller Map</title>
<meta charset="utf-8">
<link rel="shortcut icon" href="favicon.svg">
<link rel="stylesheet" href="site.css?update=2026-03-19T16:43:58">
<meta name="viewport" content="initial-scale=1, width=device-width">
<style>
a { color: blue; }
#skip { vertical-align: middle; }
</style>

<h1>You are now leaving the Traveller Map</h1>
<div class="content">

<p>
  You have clicked on a link that is taking you to an external site. If you encounter any problems, please report them to the administrator of that site.
</p>

<p>
  Click here to proceed: <a id=link target="_blank" rel=noopener></a>
</p>

<p>
  <label><input id=skip type=checkbox> Skip this notice next time</label>
</p>

</div>

<script>
const $ = s => document.querySelector(s);

const url = new URL(document.location);

// Only follow web links. Other schemes (e.g. javascript:) could run script on
// this site's origin.
function parseWebURL(s) {
  try {
    const u = new URL(s);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u : null;
  } catch (ex) {
    return null;
  }
}
const target = parseWebURL(url.searchParams.get('href') || 'https://example.com');

if (!target) {
  $('#link').replaceWith('(invalid link)');
  $('#skip').disabled = true;
} else {
  const href = target.href;
  const site = href.split('?')[0];
  $('#link').href = href;
  $('#link').innerText = site;
  $('#link').onclick = () => { setTimeout(() => window.close(), 100); };

  const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone) or (display-mode: minimal-ui)').matches;

  // localStorage can throw if storage is disabled; then just show the notice.
  const key = `tm_redirect_skip:${target.origin}`;
  let skip = false;
  try {
    skip = localStorage.getItem(key) === 'true';
  } catch (ex) {}
  if (skip) {
    $('#skip').checked = true;
    if (!standalone) {
      document.location = href;
    }
    // Otherwise... ignore, so the other site isn't trapped in a PWA window.
  }
  $('#skip').addEventListener('change', e => {
    try {
      localStorage.setItem(key, String($('#skip').checked));
    } catch (ex) {}
  });
}
</script>
